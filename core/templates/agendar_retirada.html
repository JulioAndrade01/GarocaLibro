{% extends 'base.html' %}
{% load static %}

{% block title %}Agendar Retirada{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 p-4 bg-light rounded shadow-sm" style="max-width: 700px;">
    <h2 class="text-center mb-4 text-primary">📚 Agendar Retirada de Livro</h2>

    <!-- Mensagens de sucesso/erro -->
    {% if messages %}
        <div class="mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} text-center">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Formulário -->
    <form method="POST" class="mt-4">
        {% csrf_token %}

        <!-- Selecionar Livro -->
        <div class="mb-3">
            <label for="id_livro" class="form-label fw-semibold">Selecione o livro:</label>
            <select name="livro" id="id_livro" class="form-select" required>
                <option value="">-- Escolha um livro disponível --</option>
                {% for livro in livros_list %}
                    <option value="{{ livro.id }}">
                        {{ livro.nome }} — {{ livro.autor }}
                    </option>
                {% empty %}
                    <option disabled>⚠️ Nenhum livro disponível no momento</option>
                {% endfor %}
            </select>
        </div>

        <!-- Data Agendada -->
        <div class="mb-3">
            <label for="id_data_agendada" class="form-label fw-semibold">Data de retirada:</label>
            <input 
                type="date" 
                name="data_agendada" 
                id="id_data_agendada"
                class="form-control"
                min="{{ today|default:'' }}"
                required
            >
        </div>

        <!-- Botões -->
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-4">
                💾 Confirmar Agendamento
            </button>
            <a href="{% url 'dashboard_leitor' %}" class="btn btn-secondary px-4 ms-2">
                ↩ Voltar ao Dashboard
            </a>
        </div>
    </form>
</div>

<!-- Estilo adicional opcional -->
<style>
    body {
        background-color: #f8f9fa;
    }
    .form-select:focus, .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 4px rgba(13, 110, 253, 0.3);
    }
</style>
{% endblock %}
