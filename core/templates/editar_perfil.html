{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Perfil - Garoca Libro{% endblock %}

{% block content %}
<div class="container mt-5 mb-5 p-4 bg-white rounded shadow-sm" style="max-width: 700px;">
    <h2 class="text-center text-primary mb-4">👤 Editar Perfil</h2>

    {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show text-center" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Fechar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="form-group">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-4">💾 Salvar Alterações</button>
            <a href="{% url 'perfil' %}" class="btn btn-secondary px-4 ml-2">↩ Voltar</a>
        </div>
    </form>
</div>

<style>
    body {
        background-color: #f8f9fa;
    }
    .form-group label {
        font-weight: 600;
    }
    input[type="file"] {
        border: none;
    }
</style>
{% endblock %}
